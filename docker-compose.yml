services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: secureiam
      POSTGRES_PASSWORD: secureiam
      POSTGRES_DB: secureiam
    ports:
      - "5432:5432"
    volumes:
      - secureiam_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureiam -d secureiam"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app   # live-reload friendly bind mount for local dev

volumes:
  secureiam_pgdata:
